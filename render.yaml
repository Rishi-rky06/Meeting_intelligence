databases:
  - name: meeting-intelligence-db
    plan: free
    databaseName: meeting_intelligence
    user: meeting_intelligence

services:
  - type: web
    name: meeting-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.0"

      # Auto-generated secrets
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # Database connection — auto-injected from the database above
      - key: DB_HOST
        fromDatabase:
          name: meeting-intelligence-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: meeting-intelligence-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: meeting-intelligence-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: meeting-intelligence-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: meeting-intelligence-db
          property: password

      # AI (Groq) — model/base are safe to commit; the API key is set in the dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false

      # Email (Resend) — from address is safe; the API key is set in the dashboard
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false

      # Scheduler
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "30"

      # Candidate info for /api/evaluation
      - key: CANDIDATE_NAME
        value: Sheela Rishikesh Yadav
      - key: CANDIDATE_EMAIL
        value: sheelarishikesh@gmail.com
      - key: REPOSITORY_URL
        value: https://github.com/Rishi-rky06/Meeting_intelligence
      - key: DEPLOYED_URL
        sync: false

      # Allow all hosts (set to your onrender.com domain to tighten later)
      - key: ALLOWED_HOSTS
        value: "*"
